<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Triarborium · Grupo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:ital,wght@1,500&family=Alegreya+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/src/styles/main.css">
<script type="module" src="/src/main.js"></script>
</head><body><div id="obs" hidden><div class="obs-stage"><div id="stage" class="obs-canvas"><div id="obsPlayers" class="obs-actor-list"></div><div id="obsNpcs" class="npc-list"></div><div id="obsRef"></div><div id="obsDice"></div></div></div><p id="obsMsg" class="obs-msg" hidden></p></div>

<div class="shell">
  <header class="top">
    <div class="brand"><img src="/assets/emblema-triarborium.jpg" alt="Brasão Triarborium"><div><h1>Triarborium · Grupo</h1></div></div>
    <div class="top-right">
      <nav class="views" id="views" hidden><button data-view="group" class="active">Grupo</button><button data-view="master">Área do Mestre</button></nav>
      <div class="status" id="statusBox" hidden><span class="dot" id="dot"></span><span id="statusText">Conectando…</span></div>
      <div class="row" id="acct"></div>
    </div>
  </header>

  <section id="groupView" style="display:flex;flex-direction:column;gap:16px">
    <div class="myhud" id="myHud" hidden><div class="obs-preview"></div></div>
    <div class="livebar" id="livebar"></div>
    <section class="panel sheet" id="playerView" hidden></section>
    <div class="panel playerbar" id="playerBar" hidden></div>
    <section class="panel dicetray" id="diceTray" hidden aria-label="Mesa de dados"></section>
    <div class="layout" id="sheetLayout">
      <aside class="panel roster" id="rosterPanel" aria-label="Personagens">
        <div class="roster-head"><h2>Jogadores</h2><span class="hint" id="count"></span></div>
        <div class="list" id="roster"></div>
        <div id="importBox" hidden style="display:flex;flex-direction:column;gap:6px;margin-top:6px">
          <label class="btn gold">+ Adicionar ficha (.html / .json)<input id="importFile" type="file" accept=".html,.htm,.json,text/html,application/json" multiple hidden></label>
          <p class="hint">Envie o HTML da ficha individual para criar o personagem, ou o JSON exportado pelo jogador para atualizar o progresso.</p>
        </div>
      </aside>
      <main class="panel sheet" id="sheet"></main>
    </div>
  </section>

  <section id="masterView" hidden>
    <div class="panel gate" id="gate">
      <h2>Área do Mestre</h2>
      <p class="hint">Digite a senha para abrir NPCs, referências, arquivo, notas e iniciativa.</p>
      <form id="gateForm" style="display:flex;flex-direction:column;gap:10px"><input id="pw" type="password" inputmode="numeric" autocomplete="off" aria-label="Senha do mestre"><button class="btn gold" type="submit">Entrar</button></form>
      <p class="err" id="pwErr"></p>
    </div>
    <div id="desk" hidden style="display:flex;flex-direction:column;gap:16px">
      <nav class="panel mtabs" id="mtabs"><button class="tab active" data-mtab="over">Visão Geral</button><button class="tab" data-mtab="scene">Em cena</button><button class="tab" data-mtab="players">Jogadores</button><button class="tab" data-mtab="init">Iniciativa</button><button class="tab" data-mtab="npcs">NPCs</button><button class="tab" data-mtab="refs">Referências</button><button class="tab" data-mtab="arch">Arquivo do Mestre</button><button class="tab" data-mtab="obs">Overlays (OBS)</button><button class="tab" data-mtab="msgs">Mensagens <b class="badge" id="msgTabBadge" hidden></b></button><button class="tab" data-mtab="notes">Notas</button><span class="grow"></span><button class="btn sm" id="lockBtn" hidden>Sair do mestre</button></nav>
      <div id="mbody"></div>
    </div>
  </section>

</div>
<div class="toast" id="toast" hidden></div>
<div class="dice-feed" id="diceFeed" aria-live="polite"></div>
<button class="chat-fab" id="chatFab" hidden><span aria-hidden="true">✉</span> <span id="chatFabLabel">Mestre</span><b class="badge" id="chatBadge" hidden></b></button>
<aside class="chat" id="chat" hidden aria-label="Conversa">
  <header class="chat-head"><div><small id="chatSub">Conversa privada com o mestre</small><h3 id="chatTitle">Mestre</h3></div><button class="btn sm" id="chatClose" aria-label="Fechar conversa">✕</button></header>
  <div class="chat-list" id="chatList"></div>
  <form class="chat-form" id="chatForm">
    <div class="chat-att" id="chatAtt"></div>
    <div class="chat-row"><label class="btn chat-clip" title="Anexar imagem ou arquivo">📎<input type="file" id="chatFile" multiple hidden></label><textarea id="chatText" rows="1" maxlength="4000" placeholder="Escreva uma mensagem…" aria-label="Mensagem"></textarea><button class="btn gold" type="submit" id="chatSend">Enviar</button></div>
  </form>
</aside>
<div class="lightbox" id="lightbox" hidden><img alt=""></div>
</body></html>
